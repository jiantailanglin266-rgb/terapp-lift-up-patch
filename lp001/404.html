<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,follow">
<title>ページが見つかりません｜TERAPP</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#FFF4F7;--pale:#FCE5EC;--rose:#E99AAD;--deep:#B85F78;--gold:#C9A86A;--text:#332B2E;--muted:#8A7A80;--line:rgba(233,154,173,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);background:radial-gradient(120% 90% at 50% 20%,#fff,#FFF4F7 60%,#FCE5EC);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.mark{width:auto;height:96px;margin:0 auto 1.5rem;display:block}
.code{font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,18vw,7rem);line-height:1;color:var(--deep);letter-spacing:.02em}
h1{font-size:clamp(1.1rem,4vw,1.5rem);margin:.6rem 0 1rem;font-weight:700}
p{color:var(--muted);font-size:clamp(.96rem,2.4vw,1.04rem);max-width:34ch;line-height:1.9;margin-bottom:2rem}
.links{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center}
.links a{font-family:'Montserrat',sans-serif;font-size:.82rem;letter-spacing:.04em;text-decoration:none;color:var(--deep);border:1.5px solid var(--line);border-radius:50px;padding:.75rem 1.6rem;background:#fff}
.links a.primary{background:linear-gradient(135deg,var(--rose),var(--deep));color:#fff;border:none;box-shadow:0 10px 26px rgba(184,95,120,.28)}
</style>
</head>
<body>
  <picture><source srcset="images/terapp-logo.webp" type="image/webp"><img class="mark" src="images/terapp-logo.png" width="600" height="312" alt="TERAPP" decoding="async"></picture>
  <div class="code">404</div>
  <h1>ページが見つかりませんでした</h1>
  <p>お探しのページは移動または削除された可能性があります。お手数ですが、以下からお進みください。</p>
  <div class="links">
    <a class="primary" href="index.html">トップページへ</a>
    <a href="contact.html">お問い合わせ</a>
  </div>
</body>
</html>
