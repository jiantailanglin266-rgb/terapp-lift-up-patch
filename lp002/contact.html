<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<title>お問い合わせ｜TERAPP</title>
<meta name="description" content="TERAPP（テラップ）へのお問い合わせ。メール・お電話、またはお問い合わせフォームからご連絡いただけます。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#FFF4F7;--rose:#E99AAD;--deep:#B85F78;--gold:#C9A86A;--text:#332B2E;--muted:#8A7A80;--line:rgba(233,154,173,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--text);line-height:1.9;background:var(--bg);-webkit-text-size-adjust:100%}
a{color:var(--deep)}
:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.lp-header{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(1rem,4vw,2.5rem);z-index:10}
.lp-brand{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none}
.lp-brand svg{width:28px;height:25px}
.lp-brand b{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.22em;background:linear-gradient(180deg,#E4CFA3,#C9A86A 55%,#A9843F);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.05rem}
.lp-nav a{font-family:'Montserrat',sans-serif;font-size:.7rem;letter-spacing:.12em;color:var(--muted);text-decoration:none}
main{max-width:720px;margin:0 auto;padding:clamp(2.5rem,6vw,4.5rem) 1.4rem 4rem}
.eyebrow{font-family:'Montserrat',sans-serif;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{font-family:'Shippori Mincho',serif;font-weight:600;font-size:clamp(1.5rem,4vw,2.1rem);margin:.6rem 0 1rem;letter-spacing:.03em}
.lead{color:var(--muted);font-size:.92rem;margin-bottom:1.8rem}
.direct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:2.4rem}
.direct a{display:flex;align-items:center;gap:.8rem;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem;text-decoration:none;color:var(--text)}
.direct svg{width:24px;height:24px;color:var(--deep);flex-shrink:0}
.direct .l{font-size:.68rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;font-family:'Montserrat',sans-serif}
.direct .v{font-weight:700;font-size:.95rem}
form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.8rem 1.5rem}
label{display:block;font-size:.85rem;font-weight:700;margin:1rem 0 .4rem}
label .req{color:var(--rose);font-size:.75rem;margin-left:.3rem}
input,textarea{width:100%;font-family:inherit;font-size:.92rem;padding:.75rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:#fffafc;color:var(--text)}
input:focus,textarea:focus{outline:none;border-color:var(--rose)}
textarea{min-height:130px;resize:vertical}
.consent{display:flex;align-items:flex-start;gap:.5rem;margin:1.2rem 0;font-size:.82rem;color:var(--muted)}
.consent input{width:auto;margin-top:.25rem}
.submit{margin-top:.4rem;width:100%;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;font-size:.9rem;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,var(--rose),var(--deep));padding:.95rem;border-radius:50px;box-shadow:0 10px 26px rgba(184,95,120,.3)}
.formnote{font-size:.76rem;color:var(--muted);margin-top:1rem;line-height:1.7}
.back{display:inline-block;margin-top:2.4rem;font-family:'Montserrat',sans-serif;font-size:.8rem;letter-spacing:.05em;color:var(--deep);text-decoration:none;border:1.5px solid var(--line);border-radius:50px;padding:.7rem 1.6rem}
.lp-footer{background:#332B2E;color:rgba(255,255,255,.6);padding:2.5rem 1.4rem;text-align:center;font-size:.75rem}
.lp-footer nav a{color:rgba(255,255,255,.7);margin:0 .55rem;text-decoration:none;line-height:2.2}
.lp-footer .cp{display:block;margin-top:1.2rem;font-family:'Montserrat',sans-serif;font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.3)}
</style>
</head>
<body>
<header class="lp-header">
  <a class="lp-brand" href="index.html" aria-label="TERAPP トップへ">
    <b>TERAPP</b>
  </a>
  <nav class="lp-nav"><a href="index.html">← トップへ戻る</a></nav>
</header>

<main>
  <span class="eyebrow">Contact</span>
  <h1>お問い合わせ</h1>
  <p class="lead">商品・ご購入に関するお問い合わせは、以下のメール、またはフォームよりご連絡ください。</p>

  <div class="direct">
    <a href="mailto:support@terapp.jp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6" stroke-linejoin="round"/></svg>
      <span><span class="l">Email</span><br><span class="v">support@terapp.jp</span></span>
    </a>
  </div>

  <!-- 静的ホスティングのため、送信はメールソフト起動方式（バックエンド不要）。
       正式なフォーム送信基盤（Formspree等）が用意でき次第、action を差し替えてください。 -->
  <form action="mailto:support@terapp.jp" method="post" enctype="text/plain">
    <label for="c-name">お名前<span class="req">必須</span></label>
    <input type="text" id="c-name" name="お名前" required autocomplete="name">

    <label for="c-email">メールアドレス<span class="req">必須</span></label>
    <input type="email" id="c-email" name="メールアドレス" required autocomplete="email">

    <label for="c-tel">電話番号（任意）</label>
    <input type="tel" id="c-tel" name="電話番号" autocomplete="tel">

    <label for="c-body">お問い合わせ内容<span class="req">必須</span></label>
    <textarea id="c-body" name="お問い合わせ内容" required></textarea>

    <label class="consent"><input type="checkbox" required> <span><a href="privacy.html">プライバシーポリシー</a>に同意します。</span></label>

    <button type="submit" class="submit">この内容で送信する</button>
    <p class="formnote">※送信ボタンを押すと、ご利用の端末のメールソフトが起動します。うまく起動しない場合は、お手数ですが <a href="mailto:support@terapp.jp">support@terapp.jp</a> 宛に直接メールをお送りください。</p>
  </form>

  <a class="back" href="index.html">トップページへ戻る</a>
</main>

<footer class="lp-footer">
  <nav>
    <a href="index.html">トップ</a><a href="tokushoho.html">特定商取引法に基づく表記</a><a href="privacy.html">プライバシーポリシー</a><a href="terms.html">利用規約</a><a href="contact.html">お問い合わせ</a>
  </nav>
  <span class="cp">&copy; 2026 TERAPP. All Rights Reserved.</span>
</footer>
</body>
</html>
